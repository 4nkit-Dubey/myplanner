<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Redirecting to MyPlanner</title>
    <script>
      const basePath = "/myplanner/";
      const path = window.location.pathname.startsWith(basePath)
        ? window.location.pathname.slice(basePath.length)
        : "";
      const route = path.replace(/^\/+|\/+$/g, "");
      window.location.replace(`${basePath}#/${route}`);
    </script>
  </head>
  <body>
    <p>Redirecting to MyPlanner...</p>
  </body>
</html>
